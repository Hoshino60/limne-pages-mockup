<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LIMNE様 ページ追加・改修の見本</title><style>
:root{--fg:#1d2433;--sub:#5b6475;--line:#d9dee7;--bg:#fff;--soft:#f5f7fa;--acc:#1B224C;--code:#f3f4f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Yu Gothic","YuGothic","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.8;font-size:15px}
main{max-width:980px;margin:0 auto;padding:24px 16px 80px}h1{font-size:24px;margin:8px 0 16px}h2{font-size:20px;margin:36px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--acc)}
h3{font-size:17px;margin:28px 0 8px}h4{font-size:15px;margin:20px 0 6px}a{color:#1a56b8}code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}th{background:var(--soft)}
blockquote{margin:8px 0;padding:8px 12px;border-left:4px solid var(--line);background:var(--soft)}
pre{background:var(--code);padding:12px;border-radius:6px;overflow-x:auto;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin:0}
.file{border:1px solid var(--line);border-radius:8px;margin:14px 0;overflow:hidden}.file h4{margin:0;padding:8px 12px;background:var(--soft);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.file .body{padding:12px}.preview{border:1px dashed var(--line);padding:10px 12px;margin-bottom:10px}.preview p{margin:0 0 8px}
button.copy{font:inherit;font-size:12.5px;padding:3px 10px;border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:4px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px}.card h3{margin:0 0 6px}
.lab{font-size:12px;color:var(--sub)}
</style></head><body><main><h1>LIMNE様 ページ追加・改修の見本と実装手順</h1>
<div class="cards">

<div class="card"><h3>まくら一覧・まくらベーシック・ハイブリッドエアー</h3><p><a href="pillow/index.html">見本を開く</a></p><p class="lab">ご提案の版（2026年11月23日。ご確認いただくことのお返事の前）</p></div>
</div>
</main><script>
document.addEventListener('click',function(e){var b=e.target.closest('button.copy');if(!b)return;var t=document.getElementById(b.dataset.t);
if(b.dataset.mode==='rich'){var r=document.createRange();r.selectNodeContents(t);var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();}
else{navigator.clipboard.writeText(t.textContent);}b.textContent='コピーしました';setTimeout(function(){b.textContent=b.dataset.label},1500);});
</script></body></html>
